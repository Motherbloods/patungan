name: Deploy Patungan Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-patungan-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create env files
        env:
          BE_ENV: ${{ secrets.PATUNGAN_BE_ENV }}
          FE_ENV: ${{ secrets.PATUNGAN_FE_ENV }}
        run: |
          umask 077
          printf '%s\n' "$BE_ENV" > "$GITHUB_WORKSPACE/patungan-be/.env"
          printf '%s\n' "$FE_ENV" > "$GITHUB_WORKSPACE/patungan-fe/.env"

      - name: Ensure network exists
        run: |
          docker network inspect n8n-network >/dev/null 2>&1 || docker network create n8n-network

      - name: Build backend image
        run: |
          docker build \
            -t "patungan-api-image:${GITHUB_SHA}" \
            -t patungan-api-image:latest \
            "$GITHUB_WORKSPACE/patungan-be"

      - name: Build frontend image
        run: |
          read_var() {
            grep -E "^$1=" "$GITHUB_WORKSPACE/patungan-fe/.env" | tail -n 1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"
          }
          docker build \
            --build-arg "VITE_API_BASE_URL=$(read_var VITE_API_BASE_URL)" \
            --build-arg "VITE_CREDENTIALS=$(read_var VITE_CREDENTIALS)" \
            --build-arg "VITE_GOOGLE_CLIENT_ID=$(read_var VITE_GOOGLE_CLIENT_ID)" \
            -t "patungan-fe-image:${GITHUB_SHA}" \
            -t patungan-fe-image:latest \
            "$GITHUB_WORKSPACE/patungan-fe"

      - name: Deploy backend
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/deploy-container.sh" patungan-api "patungan-api-image:${GITHUB_SHA}" \
            -p 3001:3000 \
            --network n8n-network \
            --read-only \
            -v patungan-logs:/app/logs \
            --env-file "$GITHUB_WORKSPACE/patungan-be/.env" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true

      - name: Deploy frontend
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/deploy-container.sh" patungan "patungan-fe-image:${GITHUB_SHA}" \
            -p 5176:5176 \
            --network n8n-network \
            --cap-drop ALL \
            --cap-add SETGID \
            --cap-add SETUID \
            --security-opt no-new-privileges:true

      - name: Verify running version
        run: |
          test "$(docker inspect --format '{{.Config.Image}}' patungan-api)" = "patungan-api-image:${GITHUB_SHA}"
          test "$(docker inspect --format '{{.Config.Image}}' patungan)" = "patungan-fe-image:${GITHUB_SHA}"

      - name: Cleanup old images
        if: success()
        run: |
          for repo in patungan-api-image patungan-fe-image; do
            docker images "$repo" --format '{{.Tag}}' | grep -vx latest | tail -n +4 | xargs -r -I {} docker rmi "$repo:{}" || true
          done

      - name: Cleanup env files
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/patungan-be/.env" "$GITHUB_WORKSPACE/patungan-fe/.env"
